[project]
name = "rag"
version = "0.1.0"
description = "Rag"
requires-python = ">=3.10"
dependencies = [
    "dspy",
    "fire",
    "tqdm",
    "langchain",
    "flake8",
    "bm25s",
    "chromadb",
    "mypy",
    "pydantic",
    "accelerate",
    "torch",
    "transformers"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
