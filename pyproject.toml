[project]
name = "rag"
version = "0.1.0"
description = "Rag"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "dspy",
    "fire",
    "tqdm",
    "langchain",
    "flake8",
    "bm25s",
    "chromadb",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
